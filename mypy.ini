[mypy]
python_version = 3.12
strict = true
warn_unreachable = true
warn_no_return = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_any_unimported = false
disallow_any_generics = true
disallow_subclassing_any = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
namespace_packages = true

# Suppressed project-wide:
# valid-type: methods named 'list' conflict with builtin; renaming breaks API
# type-arg: MCP SDK's Context class doesn't expose type parameters
# no-any-return: JSON parsers and dynamic dict access naturally return Any
disable_error_code = valid-type,type-arg,no-any-return

[mypy-mcp.*]
ignore_missing_imports = true

[mypy-mcp]
ignore_missing_imports = true

[mypy-rich.*]
ignore_missing_imports = true

[mypy-structlog.*]
ignore_missing_imports = true

[mypy-yaml]
ignore_missing_imports = true

[mypy-typer.*]
ignore_missing_imports = true

[mypy-fastapi.*]
ignore_missing_imports = true

[mypy-pydantic.*]
ignore_missing_imports = true
